name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: loadout-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish test build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk loadout-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build loadout-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build" \
            --notes "Latest test build from branch $GITHUB_REF_NAME. Download loadout-test.apk below and install it."
