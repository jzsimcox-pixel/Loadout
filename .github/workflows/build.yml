name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/loadout.jks"
            echo "LOADOUT_KEYSTORE=$RUNNER_TEMP/loadout.jks" >> "$GITHUB_ENV"
            echo "Shared signing key found."
          else
            echo "No shared signing key. Using the default debug key."
          fi
      - name: Test and build
        env:
          LOADOUT_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: loadout-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish test build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk loadout-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build loadout-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build" \
            --notes "Latest test build from branch $GITHUB_REF_NAME. Download loadout-test.apk below and install it."
